# docker compose -f deploy/docker-compose.yml up -d   (from the repo root, with .env and config/services.json)
services:
  status:
    build: ..
    image: status:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: ../.env
    environment:
      PORT: "8080"
    volumes:
      - ../config/services.json:/config/services.json:ro
      - status-data:/data

volumes:
  status-data:
