# Reverse proxy in front of the status page. The only special case is /api/events
# (Server-Sent Events): no buffering and long timeouts, or the page stops updating live.
server {
    listen 443 ssl;
    server_name status.example.internal;
    # ssl_certificate / ssl_certificate_key …

    location /api/events {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Grafana's webhook contact point. Restrict it to Grafana if you can.
    location /hooks/ {
        # allow 10.0.0.0/8; deny all;
        proxy_pass http://127.0.0.1:8080;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
    }
}
