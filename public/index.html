<!doctype html>
<html lang="es" data-pt-theme="light" data-pt-version="2">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Estado de servicios</title>
    <link rel="icon" id="favicon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400..700&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />
    <link rel="stylesheet" href="/punto.css" />
    <link rel="stylesheet" href="/app.css" />
    <script>
      // Punto's themeInitScript (key pt-theme, night = OLED, as in the Operations page): the
      // stored choice of the theme switch, or the device. ?theme=light|dark|oled and
      // ?palette=punto|marea|siena|citrico pin them for wallboards; ?version=1 shows the poster
      // edition. app.js keeps it in sync afterwards.
      (() => {
        const q = new URLSearchParams(location.search);
        const root = document.documentElement;
        let p = null;
        try {
          p = localStorage.getItem("pt-theme");
        } catch {}
        const pinned = q.get("theme");
        const t = ["light", "dark", "oled"].includes(pinned ?? p)
          ? (pinned ?? p)
          : matchMedia("(prefers-color-scheme: dark)").matches
            ? "oled"
            : "light";
        root.setAttribute("data-pt-theme", t);
        if (q.get("palette")) root.setAttribute("data-pt-palette", q.get("palette"));
        if (q.get("version") === "1") root.removeAttribute("data-pt-version");
      })();
    </script>
  </head>
  <body>
    <div class="fm-page">
      <header class="fm-mast fm-gutter">
        <span class="fm-mast__brand">
          <svg class="pt-dotmark" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="4" cy="4" r="2.6" /><circle cx="12" cy="4" r="2.6" /><circle class="pt-dotmark__seal" cx="20" cy="4" r="2.6" />
            <circle cx="4" cy="12" r="2.6" /><circle cx="12" cy="12" r="2.6" /><circle cx="20" cy="12" r="2.6" />
            <circle cx="4" cy="20" r="2.6" /><circle cx="12" cy="20" r="2.6" /><circle cx="20" cy="20" r="2.6" />
          </svg>
          <span id="brand-title">Estado de servicios</span>
        </span>
        <span class="fm-mast__fill"></span>
        <span class="pt-folio fm-mast__issue" id="issue"></span>
        <span id="live" aria-live="polite"></span>
        <span id="theme"></span>
      </header>
      <hr class="pt-rule" />

      <section class="fm-head fm-gutter" id="head"></section>
      <hr class="pt-rule" />

      <main class="fm-main fm-gutter">
        <div class="fm-stats" id="stats"></div>
        <section class="pt-stack pt-stack--column" style="--gap: var(--pt-space-5)" id="services"></section>
        <section class="pt-stack pt-stack--column" style="--gap: var(--pt-space-5)" id="incidents"></section>
        <section class="pt-stack pt-stack--column" style="--gap: var(--pt-space-5)" id="log"></section>
      </main>

      <footer class="fm-foot fm-gutter">
        <div class="fm-foot__strip" id="strip"></div>
        <div class="fm-foot__line" id="foot"></div>
      </footer>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
